<script type="text/babel">
    const { BfHero, BfMarquee, BfStats, BfGap, BfWho, BfBuild, BgBuildPath, BfExplore, BfTransformation, BfPricing, BfFinal, BgPartner, AnthropicGlyph, AwFooter, BF_DATE } = window;

  function App() {
    React.useEffect(() => {
      const draw = () => { if (window.lucide && window.lucide.createIcons) window.lucide.createIcons(); };
      draw();
      const t = setInterval(draw, 400);
      const stop = setTimeout(() => clearInterval(t), 3000);

      let ctx = null, cancelVis = () => {};
      if (window.gsap && window.ScrollTrigger) {
        cancelVis = awWhenVisible(() => {
          ctx = gsap.context(() => {
            document.querySelectorAll('[data-rv-group]').forEach((group) => {
              const els = group.querySelectorAll('[data-rv]');
              if (!els.length) return;
              // Cards cascade in one by one — bigger rise + clear per-item beat.
              gsap.from(els, {
                y: 44, opacity: 0, duration: .9, ease: 'power3.out',
                stagger: { each: .22 },
                clearProps: 'transform,opacity', // hand style control back to CSS so :hover transforms keep working
                scrollTrigger: { trigger: group, start: 'top 88%', once: true },
              });
            });
            ScrollTrigger.refresh();
          });
        });
      }
      return () => { clearInterval(t); clearTimeout(stop); cancelVis(); if (ctx) ctx.revert(); };
    }, []);

    return (
      <React.Fragment>
        <a className="aw-skip" href="#main">Skip to content</a>
        <SiteNav campaign />
        <main id="main">
          <BfHero />
          <BfMarquee />
          <BgPartner />
          <BfGap />
          <BfStats />
          <BfWho />
          <BfBuild />
          <BgBuildPath />
          <BfExplore />
          <BfTransformation />
          <BfFinal />
        </main>
        <AwFooter campaign tagline="Learn with Claude. Build through Colaberry. Deploy in the real world. Helping builders, founders, and idea owners turn ideas into AI-powered systems since 2012." dateLabel={'Free Open House \u00b7 live online'} />
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
